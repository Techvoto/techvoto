name: Backend quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "True"
      DATABASE_URL: sqlite:///ci.sqlite3
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
      AUTH_COOKIE_SECURE: "False"
      NUM_PROXIES: "1"
      PAYSTACK_SECRET_KEY: ""
      JITSI_APP_ID: ""
      JITSI_KID: ""
      JITSI_APP_SECRET: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check
      - name: Production security checks (CI-only local cache override)
        env:
          DEBUG: "False"
          AUTH_COOKIE_SECURE: "True"
          ALLOW_LOCMEMCACHE: "True"
        run: python manage.py check --deploy --fail-level ERROR
      - run: python manage.py test
